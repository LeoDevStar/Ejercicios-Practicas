<div [ngClass]="{'activity-details-container': showDetails() == true, 'no-show': showDetails() == false}">
    <p class="subtitle">To-do:</p>
    <div class="activity-details-inputs">
        <!-- @if(load_activity(); as activity){
            <input type="text" #inputName class="detail-input" value={{activity.name}}>
            <textarea rows="5" cols="40" #inputDescription class="detail-textarea">{{activity.description}}</textarea>
        }@else {
            <input type="text" #inputName name="titleInput" class="detail-input" value="">
            <textarea rows="5" cols="40" #inputDescription class="detail-textarea"></textarea>
        } -->
        <input type="text" [(ngModel)]="activity.name" class="detail-input" value={{load_activity().name}}>
        <textarea rows="5" cols="40" [(ngModel)]="activity.description" class="detail-textarea" value={{load_activity().description}}></textarea>
        <!-- <input type="text" class="detail-input"> -->
         
    </div>
    <div class="list-container">
        <label for="list">List:</label>
         <!-- <p>List: </p> -->
        <select name="list" id="list" [(ngModel)]="activity.list">
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Household">Household</option>
            <option value="Business">Business</option>
        </select>
    </div>

    <div class="list-container">
        <label for="datefield">Due Date:</label>
        <input type="date" id="datefield" name="datefield" [(ngModel)]="activity.date" required>
    </div>
    
    <!-- <p>List: <span>Work</span> </p> -->
    <!-- <p>Due Date: June 25, 2025</p> -->
    <div class="activity-details-buttons">
        <button class="text-button">Delete Task</button>
        <button class="save-button" (click)="newActivity()">Save Changes</button>
    </div>
</div>
