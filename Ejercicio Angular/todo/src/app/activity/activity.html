<div class="activity-container">
    <input type="checkbox" class="activity-checkbox">
    <div class="activity-content">
        <p>{{activity().name}}</p>
        <span [ngClass]="typeStyles(activity().list)">{{activity().list}}</span>
    </div>
    <a>
        <img 
            src="/icons/chevron_right_icon.svg"
            alt="Right Arrow"
            class="activity-arrow">
    </a>
</div>
