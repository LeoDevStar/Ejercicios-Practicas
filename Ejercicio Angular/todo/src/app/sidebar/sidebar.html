<div class="sidebar">
    <div class="profile">
        <img 
        width="50" 
        height="50"
        src="/icons/user_gray_icon.svg"
        alt="Image Profile">
        <p>Juan Dela Cruz</p>
    </div>
    <div class="search">
        <input type="search" #searchInput placeholder="Search">
    </div>
    <div class="options">
    <p class="subtitle-sidebar">Tasks</p>
        <ul>
            <li>
                <img 
                src="/icons/note_add_icon.svg" 
                alt="Add Task Icon">
                <a>All tasks</a>
            </li>
            <li>
                <img 
                src="/icons/star_icon.svg" 
                alt="Add Task Icon">
                <a>Important</a>
            </li>
            <li>
                <img 
                src="/icons/hourglass_bottom_icon.svg" 
                alt="Add Task Icon">
                <a>Overdue</a>
            </li>
            <li>
                <img 
                src="/icons/next_week_icon.svg" 
                alt="Add Task Icon">
                <a>This Week</a>
            </li>
        </ul>
    </div>
    <div class="options">
        <div class="list-header-options">
            <p class="subtitle-sidebar">List</p>
            <a>+</a>
        </div>
    
        <ul>
            <li>
                <div class="circle" style="background-color: rgb(175 219 251);"></div>
                <a>Work</a>
            </li>
            <li>
                <div class="circle" style="background-color: rgb(255 174 190);"></div>
                <a>Personal</a>
            </li>
            <li>
                <div class="circle" style="background-color: rgb(185 175 255);"></div>
                <a>Household</a>
            </li>
            <li>
                <div class="circle" style="background-color: rgb(173 255 175);"></div>
                <a>Business</a>
            </li>
        </ul>
    </div>
    <div [ngClass]="['options', 'account-opt']">
        <ul>
            <li>
                
                <img 
                src="/icons/settings_icon.svg"
                alt="settings icon">
                <a><p>Settings</p></a>
            </li>
            <li>
                <img 
                src="/icons/logout_icon.svg"
                alt="log out icon">
                <a><p>Log Out</p></a>
            </li>
        </ul>
    </div>
</div>
