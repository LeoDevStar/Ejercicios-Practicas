<div class="sidebar">
    <div class="profile">
        <img 
        width="50" 
        height="50"
        alt="Image Profile">
        <p>Juan Dela Cruz</p>
    </div>
    <div class="options">
    <p class="subtitle">Tasks</p>
        <ul>
            <li>
                <img 
                 
                alt="Icon Profile">
                <a>All tasks</a>
            </li>
            <li>
                <img 
                 
                alt="Icon Profile">
                <a>Important</a>
            </li>
            <li>
                <img 
                 
                alt="Icon Profile">
                <a>Overdue</a>
            </li>
            <li>
                <img 
                 
                alt="Icon Profile">
                <a>This Week</a>
            </li>
        </ul>
    </div>
    <div class="options">
        <div class="list-header-options">
            <p class="subtitle">List</p>
            <a>+</a>
        </div>
    
        <ul>
            <li>
                <div class="circle" style="background-color: rgb(175 219 251);"></div>
                <a>Work</a>
            </li>
            <li>
                <div class="circle" style="background-color: rgb(255 174 190);"></div>
                <a>Personal</a>
            </li>
            <li>
                <div class="circle" style="background-color: rgb(185 175 255);"></div>
                <a>Household</a>
            </li>
            <li>
                <div class="circle" style="background-color: rgb(173 255 175);"></div>
                <a>Business</a>
            </li>
        </ul>
    </div>
    <div [ngClass]="['options', 'account-opt']">
        <ul>
            <li>
                
                <img alt="settings icon">
                <a><p>Settings</p></a>
            </li>
            <li>
                <img alt="log out icon">
                <a><p>Log Out</p></a>
            </li>
        </ul>
    </div>
</div>
